<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crop Yield Prediction</title>
</head>
<body>
<h1>Crop Yield Prediction</h1>

<select id="crop">
  <option>Barley</option>
  <option>Rice</option>
  <option>Chickpea</option>
</select>

<input type="number" id="dose" placeholder="Dose Gy">
<input type="number" id="temp" placeholder="Avg Temp C">
<input type="number" id="rainfall" placeholder="Rainfall mm">
<input type="number" id="growth" placeholder="Growth Days">

<button onclick="predictYield()">Predict</button>

<h2 id="result"></h2>

<script>
async function predictYield() {
    const data = {
        Crop: document.getElementById("crop").value,
        Radiation_Type: "Gamma_Ray",       // example static
        Dose_Gy: parseFloat(document.getElementById("dose").value),
        Mutation_Trait: "Salt_Tolerance",  // example static
        Location: "Naypyidaw",             // example static
        Soil_Type: "Loamy",                 // example static
        Avg_Temp_C: parseFloat(document.getElementById("temp").value),
        Rainfall_mm: parseFloat(document.getElementById("rainfall").value),
        Growth_Days: parseInt(document.getElementById("growth").value)
    };

    const response = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });
 
    const result = await response.json();
   document.getElementById("result").innerText = "Predicted Yield: " + result.Predicted_Yield_kg_per_acre.toFixed(2) + " kg/acre";
}
</script>
</body>
</html>
